name: Backend CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      AWS_REGION: ap-northeast-2
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: fleaflea-ci-test
      S3_INTEGRATION_TEST: "false"
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      SMTP_USERNAME: ci@example.invalid
      SMTP_PASSWORD: ci-only-not-a-real-password
      EMAIL_VERIFICATION_HASH_SECRET: ci-only-email-verification-secret-not-for-production

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Check deployment recovery
        run: |
          bash -n deploy/gcp/deploy.sh deploy/gcp/rollback.sh deploy/gcp/install-operations.sh
          python3 -m py_compile deploy/gcp/operations.py deploy/gcp/configure-monitoring.py
          python3 -m unittest discover -s deploy/gcp/tests -v
          bash -n deploy/gcp/dev/deploy.sh
          python3 -m unittest discover -s deploy/gcp/dev/tests -v

      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests/test/
            build/test-results/test/
          if-no-files-found: warn
          retention-days: 7
