name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build deployment JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: fleaflea-github-deploy

      - name: Upload JAR to S3
        id: artifact
        run: |
          set -euo pipefail

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_PATH"

          S3_URI="s3://${{ vars.DEPLOY_BUCKET }}/deployments/fleaflea.jar"
          aws s3 cp "$JAR_PATH" "$S3_URI"

          echo "s3_uri=$S3_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          S3_URI: ${{ steps.artifact.outputs.s3_uri }}
        run: |
          set -euo pipefail

          PARAMETERS="$(jq -n --arg uri "$S3_URI" '{
            commands: [
              "set -euo pipefail",
              ("/usr/local/bin/aws s3 cp " + $uri + " /tmp/fleaflea-new.jar"),
              "cp /opt/fleaflea/fleaflea.jar /opt/fleaflea/fleaflea.jar.backup",
              "install -o fleaflea -g fleaflea -m 640 /tmp/fleaflea-new.jar /opt/fleaflea/fleaflea.jar",
              "systemctl restart fleaflea",
              "for i in $(seq 1 30); do if curl -fsS -o /dev/null http://localhost/actuator/health; then exit 0; fi; sleep 2; done; cp /opt/fleaflea/fleaflea.jar.backup /opt/fleaflea/fleaflea.jar; systemctl restart fleaflea; exit 1"
            ]
          }')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Fleaflea backend" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --output json

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)"

          test "$STATUS" = "Success"