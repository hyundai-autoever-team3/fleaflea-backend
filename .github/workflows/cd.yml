name: Backend CD

on:
  workflow_run:
    workflows: ["Backend CI"]
    types: [completed]

permissions:
  id-token: write
  contents: read
  packages: write

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to EC2
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build deployment JAR
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

          JAR_PATH="$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-plain.jar' -print -quit)"
          test -n "$JAR_PATH"
          mkdir -p build/deploy
          cp "$JAR_PATH" build/deploy/fleaflea.jar

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: fleaflea-github-deploy

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
          IMAGE_TAG: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_URI="${IMAGE_REPOSITORY,,}:$IMAGE_TAG"
          docker build --pull --tag "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy through SSM
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail

          COMPOSE_B64="$(base64 -w 0 deploy/ec2/compose.yml)"
          DEPLOY_SCRIPT_B64="$(base64 -w 0 deploy/ec2/deploy.sh)"

          PARAMETERS="$(jq -n \
            --arg compose "$COMPOSE_B64" \
            --arg script "$DEPLOY_SCRIPT_B64" \
            --arg image "$IMAGE_URI" \
            '{commands: [
              "set -eu",
              "mkdir -p /opt/fleaflea",
              ("printf %s " + ($compose | @sh) + " | base64 -d > /opt/fleaflea/compose.yml"),
              ("printf %s " + ($script | @sh) + " | base64 -d > /opt/fleaflea/deploy.sh"),
              "chmod 700 /opt/fleaflea/deploy.sh",
              ("/opt/fleaflea/deploy.sh " + ($image | @sh))
            ]}')"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ vars.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Fleaflea containers" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)"

          echo "SSM command: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --output json

          STATUS="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.EC2_INSTANCE_ID }}" \
            --query "Status" \
            --output text)"

          test "$STATUS" = "Success"
