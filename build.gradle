plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.anabada'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'org.postgresql:postgresql'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	// Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	// AWS SDK
	implementation platform('software.amazon.awssdk:bom:2.54.17')
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:signin'

	// WebP 이미지 검증
	implementation 'com.twelvemonkeys.imageio:imageio-webp:3.14.0'

	// Actuator
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// QueryDSL
	implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.6'
	annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.6:jpa'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Local environment variables from .env (see .env.example). The file is optional:
// CI and EC2 set real environment variables, and those always win over the file.
def dotenvFile = file('.env')
def dotenv = [:]
if (dotenvFile.exists()) {
	dotenvFile.eachLine { line ->
		def entry = line.trim().replaceFirst(/^export\s+/, '')
		if (!entry || entry.startsWith('#') || !entry.contains('=')) {
			return
		}
		def (key, value) = entry.split('=', 2).collect { it.trim() }
		if (value.length() >= 2 && value[0] == value[-1] && value[0] in ['"', "'"]) {
			value = value[1..-2]
		}
		// An empty value (JWT_SECRET=) would override application.yaml defaults.
		if (value && System.getenv(key) == null) {
			dotenv[key] = value
		}
	}
}

['bootRun', 'test'].each { taskName ->
	tasks.named(taskName) {
		environment dotenv
		if (dotenvFile.exists()) {
			// Re-run tests when .env changes; hashed, so values are not stored.
			inputs.file(dotenvFile)
		}
	}
}

// Local performance measurement: gradlew bootRun -Pperf
// The settings live here, not in a profile file, so that nothing measurement
// related ships in the deployed jar. On EC2 Nginx proxies /actuator publicly,
// and these settings would expose heap and connection pool numbers there.
tasks.named('bootRun') {
	if (project.hasProperty('perf')) {
		def perfDir = layout.buildDirectory.dir('perf').get().asFile
		doFirst { perfDir.mkdirs() }
		systemProperty 'management.endpoints.web.exposure.include', 'health,metrics'
		// Server side p95/p99 per endpoint, to compare against k6's client side numbers.
		systemProperty 'management.metrics.distribution.percentiles.[http.server.requests]', '0.95,0.99'
		jvmArgs "-Xlog:gc*:file=${perfDir}/gc.log:time,uptime,level,tags"
	}
}
