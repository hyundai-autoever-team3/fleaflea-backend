name: fleaflea

services:
  postgres:
    image: postgres:16
    container_name: fleaflea-postgres
    restart: unless-stopped
    env_file:
      - /etc/fleaflea/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    container_name: fleaflea-app
    restart: unless-stopped
    env_file:
      - /etc/fleaflea/fleaflea.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fleaflea_db
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1g

volumes:
  postgres_data:
    name: fleaflea_postgres_data
