name: fleaflea

services:
  postgres:
    image: postgres:16
    container_name: fleaflea-postgres
    restart: unless-stopped
    env_file:
      - /etc/fleaflea/postgres.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s

  redis:
    image: redis:7.4
    container_name: fleaflea-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in /etc/fleaflea/redis.env}
    command:
      - /bin/sh
      - -ec
      - |
        : "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
        exec redis-server --requirepass "$${REDIS_PASSWORD}" --appendonly yes --appendfsync everysec --maxmemory 128mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$${REDIS_PASSWORD}\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 30s
    mem_limit: 256m

  app:
    image: ${APP_IMAGE:?APP_IMAGE must be set}
    container_name: fleaflea-app
    restart: unless-stopped
    env_file:
      - /etc/fleaflea/fleaflea.env
      - /etc/fleaflea/redis.env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/fleaflea_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    stop_grace_period: 30s
    mem_limit: 1g

volumes:
  redis_data:
    name: fleaflea_redis_data
  postgres_data:
    name: fleaflea_postgres_data
