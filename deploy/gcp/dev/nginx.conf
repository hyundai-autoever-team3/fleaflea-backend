# Install only on the dev VM, after replacing the old performance virtual host.
server {
    listen 80;
    server_name ${DEV_API_HOST};
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://${DEV_API_HOST}$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name ${DEV_API_HOST};
    ssl_certificate /etc/letsencrypt/live/${DEV_API_HOST}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${DEV_API_HOST}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 110m;
    location / {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }
}
