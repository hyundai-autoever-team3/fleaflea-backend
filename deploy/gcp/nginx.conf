server {
    listen 127.0.0.1:80 default_server;
    server_name api.fleaflea.app;

    include /etc/nginx/fleaflea-proxy.conf;
}

server {
    listen 443 ssl;
    server_name api.fleaflea.app;

    ssl_certificate /etc/fleaflea/tls/fullchain.pem;
    ssl_certificate_key /etc/fleaflea/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;

    include /etc/nginx/fleaflea-proxy.conf;
}
