services:
  app:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    restart: unless-stopped
    env_file:
      - /etc/fleaflea/fleaflea.env
      - /etc/fleaflea/redis.env
    environment:
      APP_ENV: production
      MANAGEMENT_PORT: "8081"
      DB_URL: jdbc:postgresql://postgres:5432/fleaflea_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_HEALTH_ENABLED: "true"
      CHAT_REDIS_ENABLED: "true"
      IMAGE_STORAGE: gcs
      # Ignore legacy key-file settings in env_file; ADC uses the VM identity.
      GOOGLE_APPLICATION_CREDENTIALS: ""
      SERVER_SHUTDOWN: graceful
      SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE: 30s
    ports:
      - "127.0.0.1:${APP_PORT:?APP_PORT is required}:8080"
    networks:
      - infrastructure
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          status=$$(curl -sS --max-time 3 -o /dev/null -w '%{http_code}' http://localhost:8080/readyz) || exit 1;
          case "$$status" in
            200) exit 0 ;;
            401|404) curl -fsS --max-time 3 http://localhost:8080/actuator/health >/dev/null ;;
            *) exit 1 ;;
          esac
      interval: 5s
      timeout: 7s
      retries: 36
      start_period: 30s
    stop_grace_period: 75s
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  infrastructure:
    external: true
    name: fleaflea_default
