global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    stack: fleaflea

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

# GCP metrics arrive through Alloy remote_write and the SSH reverse tunnel.
# This viewer does not scrape a local Spring app, database, or host exporter.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
