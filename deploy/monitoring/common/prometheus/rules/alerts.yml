groups:
  - name: fleaflea-service
    rules:
      - alert: FleafleaReachabilityCheckFailed
        expr: probe_success{job="blackbox-http", service="fleaflea", probe_location="local"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 로컬 위치에서 Fleaflea 접속 확인에 실패했습니다
          description: '{{ $labels.instance }} 검사가 3분 동안 실패했습니다. {{ if eq $labels.environment "production" }}로컬 네트워크·접속 경로 문제일 수 있으므로 GCP Uptime Check 결과도 확인하세요.{{ else }}로컬 앱 실행 상태와 연결을 확인하세요.{{ end }}'
          uptime_check_url: https://console.cloud.google.com/monitoring/uptime
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#external-down

      - alert: FleafleaHigh5xxRate
        expr: |
          (
            sum by (environment) (rate(http_server_requests_seconds_count{service="fleaflea", status=~"5..", uri!~"/readyz|/actuator(/.*)?"}[5m]))
            /
            sum by (environment) (rate(http_server_requests_seconds_count{service="fleaflea", uri!~"/readyz|/actuator(/.*)?"}[5m]))
          ) > 0.05
          and
          sum by (environment) (increase(http_server_requests_seconds_count{service="fleaflea", uri!~"/readyz|/actuator(/.*)?"}[5m])) >= 100
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: Fleaflea 서버의 5xx 오류가 설정한 기준치를 초과했습니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#high-5xx

      - alert: Fleaflea5xxBurst
        expr: |
          sum by (environment) (increase(http_server_requests_seconds_count{service="fleaflea", status=~"5..", uri!~"/readyz|/actuator(/.*)?"}[5m])) >= 10
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Fleaflea API에서 최근 5분간 5xx 오류가 10건 이상 발생했습니다

      - alert: FleafleaRouteP95Slow
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, uri, environment) (
              rate(http_server_requests_seconds_bucket{service="fleaflea", uri!~"/readyz|/actuator/.*|UNKNOWN|/api/v1/notifications/subscribe"}[5m])
            )
          ) > 1
          and
          sum by (uri, environment) (
            increase(http_server_requests_seconds_count{service="fleaflea", uri!~"/readyz|/actuator/.*|UNKNOWN|/api/v1/notifications/subscribe"}[5m])
          ) >= 100
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Fleaflea API 경로의 p95 응답 시간이 1초를 초과했습니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#slow-api

      - alert: FleafleaDatabaseConnectionPending
        expr: hikaricp_connections_pending{service="fleaflea"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Fleaflea 요청이 데이터베이스 연결을 기다리고 있습니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#database-pool

      - alert: FleafleaTelemetryMissing
        expr: |
          min by (environment) (up{job="fleaflea-app"}) == 0
          or
          (
            max by (environment) (up{job="blackbox-http", service="fleaflea"})
            unless on (environment)
            max by (environment) (up{job="fleaflea-app"})
          )
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 애플리케이션 지표가 3분 동안 Prometheus에 도착하지 않았습니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#telemetry-missing

  - name: infrastructure
    rules:
      - alert: HostDiskSpaceLow
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"} < 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 호스트 디스크 여유 공간이 20% 미만입니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#disk-space

      - alert: HostDiskSpaceCritical
        expr: |
          100 * node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"}
          / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|erofs"} < 10
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: 호스트 디스크 여유 공간이 10% 미만입니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#disk-space

      - alert: MonitoringTargetDown
        expr: up{job=~"prometheus|loki|tempo|monitoring-node|blackbox-http"} == 0
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: 중앙 모니터링 대상의 지표 수집에 실패했습니다
          runbook_url: https://github.com/hyundai-autoever-team3/fleaflea-backend/wiki/%EB%AA%A8%EB%8B%88%ED%84%B0%EB%A7%81-%EA%B0%80%EC%9D%B4%EB%93%9C#monitoring-target-down

  - name: telemetry-delivery
    rules:
      - alert: FleafleaCollectorScrapeFailed
        expr: up{job="fleaflea-alloy"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: Alloy 전송 상태 지표를 수집하지 못했습니다
      - alert: FleafleaLogDeliveryStalled
        expr: |
          sum by (environment, instance) (increase(loki_write_batch_retries_total{job="fleaflea-alloy"}[5m])) > 0
          and on (environment, instance)
          sum by (environment, instance) (increase(loki_write_sent_entries_total{job="fleaflea-alloy"}[5m])) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 로그 전송 재시도가 발생하며 최근 5분간 성공한 전송이 없습니다
      - alert: FleafleaLogEntriesDropped
        expr: sum by (environment, instance, reason) (increase(loki_write_dropped_entries_total{job="fleaflea-alloy"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 전송하지 못한 로그가 폐기됐습니다
      - alert: FleafleaTraceDeliveryStalled
        expr: |
          sum by (environment, instance) (increase(otelcol_exporter_send_failed_spans_total{job="fleaflea-alloy"}[5m])) > 0
          and on (environment, instance)
          sum by (environment, instance) (increase(otelcol_exporter_sent_spans_total{job="fleaflea-alloy"}[5m])) == 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 트레이스 전송 실패가 발생하며 최근 5분간 성공한 전송이 없습니다
      - alert: FleafleaTraceQueueAlmostFull
        expr: |
          otelcol_exporter_queue_size{job="fleaflea-alloy", data_type="traces"}
          / otelcol_exporter_queue_capacity{job="fleaflea-alloy", data_type="traces"} > 0.8
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: 트레이스 전송 대기 큐가 80% 이상 찼습니다
      - alert: FleafleaTraceEnqueueFailed
        expr: sum by (environment, instance) (increase(otelcol_exporter_enqueue_failed_spans_total{job="fleaflea-alloy"}[5m])) > 0
        labels:
          severity: critical
        annotations:
          summary: 트레이스를 전송 대기 큐에 넣지 못했습니다
