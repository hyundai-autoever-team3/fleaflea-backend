# Combine with deploy/monitoring/common/compose.yml first.
name: fleaflea-monitoring-gcp
services:
  prometheus:
    container_name: fleaflea-gcp-prometheus
    ports: !override ["127.0.0.1:9091:9090"]
    volumes:
      - ../gcp/prometheus/rules/alerts.yml:/etc/prometheus/rules/gcp.yml:ro
      - ../gcp/blackbox/targets.yml:/etc/prometheus/targets/blackbox.yml:ro
  alertmanager:
    container_name: fleaflea-gcp-alertmanager
    ports: !override ["127.0.0.1:9094:9093"]
  loki:
    container_name: fleaflea-gcp-loki
    ports: !override ["127.0.0.1:3101:3100"]
  tempo:
    container_name: fleaflea-gcp-tempo
    ports: !override ["127.0.0.1:14317:4317", "127.0.0.1:3201:3200"]
  grafana:
    container_name: fleaflea-gcp-grafana
    environment:
      GF_SERVER_ROOT_URL: http://localhost:3001
    ports: !override ["127.0.0.1:3001:3000"]
  blackbox-exporter:
    container_name: fleaflea-gcp-blackbox-exporter

secrets:
  discord_webhook_url:
    file: ../secrets/discord-webhook-url-gcp
