# Only the Docker API routes used by Alloy discovery and Docker log tailing.
# Inspect responses are not redacted; keep this proxy on the private network.
global
    log stdout format raw daemon warning
    maxconn 64

defaults
    mode http
    log global
    option httplog
    option http-server-close
    timeout connect 5s
    timeout http-request 10s
    timeout client 10m
    timeout server 10m

frontend dockerfrontend
    bind :2375
    acl is_get method GET
    acl is_head method HEAD
    acl is_ping path -m reg ^(/v[0-9]+[.][0-9]+)?/_ping$
    acl is_version path -m reg ^(/v[0-9]+[.][0-9]+)?/version$
    acl is_container_list path -m reg ^(/v[0-9]+[.][0-9]+)?/containers/json$
    acl is_network_list path -m reg ^(/v[0-9]+[.][0-9]+)?/networks$
    acl is_container_read path -m reg ^(/v[0-9]+[.][0-9]+)?/containers/[a-f0-9]{64}/(json|logs)$
    http-request deny deny_status 403 unless is_get || is_head
    http-request deny deny_status 403 if is_head !is_ping
    http-request deny deny_status 403 unless is_ping || is_version || is_container_list || is_network_list || is_container_read
    default_backend dockerbackend

backend dockerbackend
    server dockersocket /var/run/docker.sock
