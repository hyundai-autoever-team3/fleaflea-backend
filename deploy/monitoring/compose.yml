name: fleaflea-monitoring

services:
  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: fleaflea-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-20GB}
      - --web.enable-lifecycle
      - --web.enable-remote-write-receiver
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./prometheus/targets:/etc/prometheus/targets:ro
      - prometheus_data:/prometheus
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-127.0.0.1}:9090:9090"
    depends_on:
      - alertmanager
      - blackbox-exporter
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/ready >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.28.1
    container_name: fleaflea-alertmanager
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "127.0.0.1:9093:9093"
    mem_limit: 128m
    security_opt:
      - no-new-privileges:true

  loki:
    image: grafana/loki:3.7.7
    container_name: fleaflea-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-127.0.0.1}:3100:3100"
    healthcheck:
      test: ["CMD", "/usr/bin/loki", "-version"]
      interval: 30s
      timeout: 5s
      retries: 5
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  tempo:
    image: grafana/tempo:2.9.0
    container_name: fleaflea-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/config.yml"]
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo_data:/var/tempo
    ports:
      - "${TELEMETRY_BIND_ADDRESS:-127.0.0.1}:4317:4317"
      - "127.0.0.1:3200:3200"
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.27.0
    container_name: fleaflea-blackbox-exporter
    restart: unless-stopped
    command: ["--config.file=/etc/blackbox/config.yml"]
    volumes:
      - ./blackbox/config.yml:/etc/blackbox/config.yml:ro
    mem_limit: 64m
    read_only: true
    security_opt:
      - no-new-privileges:true

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: fleaflea-monitoring-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
    mem_limit: 64m
    read_only: true
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.2.0
    container_name: fleaflea-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD is required}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_started
      tempo:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

volumes:
  prometheus_data:
  alertmanager_data:
  loki_data:
  tempo_data:
  grafana_data:
