name: fleaflea-monitoring-local

# Combine with deploy/monitoring/common/compose.yml first; paths are relative to that base file.
services:
  alertmanager:
    environment:
      DASHBOARD_URL: "${LOCAL_GRAFANA_URL:-http://localhost:3000}/d/fleaflea-overview/fleaflea-overview?orgId=1&from=now-1h&to=now&var-environment=local&refresh=15s"

  prometheus:
    volumes:
      - ../local/blackbox/targets.yml:/etc/prometheus/targets/blackbox.yml:ro

  blackbox-exporter:
    extra_hosts:
      - host.docker.internal:host-gateway

  postgres-exporter-local:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    container_name: fleaflea-local-postgres-exporter
    restart: unless-stopped
    environment:
      DATA_SOURCE_URI: host.docker.internal:5432/fleaflea_db?sslmode=disable
      DATA_SOURCE_USER: ${LOCAL_DB_USERNAME:-postgres}
      DATA_SOURCE_PASS: ${LOCAL_DB_PASSWORD:-password}
    extra_hosts:
      - host.docker.internal:host-gateway
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m

  alloy-local:
    image: grafana/alloy:v1.19.2
    container_name: fleaflea-local-alloy
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy
      - /etc/alloy/config.alloy
    volumes:
      - ../local/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./alloy/pipelines.alloy:/etc/alloy/pipelines.alloy:ro
      - ../../../build/logs:/var/log/fleaflea:ro
      - local_alloy_data:/var/lib/alloy
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:12346:12345"
    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      - prometheus
      - loki
      - tempo
      - postgres-exporter-local
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m

secrets:
  discord_webhook_url:
    file: ../secrets/discord-webhook-url-local

volumes:
  local_alloy_data:
    name: fleaflea-monitoring_local_alloy_data
  prometheus_data:
    name: fleaflea-monitoring_prometheus_data
  alertmanager_data:
    name: fleaflea-monitoring_alertmanager_data
  loki_data:
    name: fleaflea-monitoring_loki_data
  tempo_data:
    name: fleaflea-monitoring_tempo_data
  grafana_data:
    name: fleaflea-monitoring_grafana_data
