spring:
  application:
    name: fleaflea

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleaflea_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true

  task:
    scheduling:
      pool:
        size: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Kakao
            scope:
              - openid
              - account_email
              - profile_nickname
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - email
              - profile
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: Naver
            scope:
              - openid
        provider:
          kakao:
            issuer-uri: https://kauth.kakao.com
          naver:
            issuer-uri: https://nid.naver.com
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true

app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:local}
  frontend-url: ${FRONTEND_URL:http://localhost:5175}
  email-verification:
    hash-secret: ${EMAIL_VERIFICATION_HASH_SECRET}

  image:
    storage: ${IMAGE_STORAGE:s3}

  redis-lock:
    wait-time: ${REDIS_LOCK_WAIT_TIME:5s}
    # Backward-compatible env name: Redisson watchdog timeout, not a fixed lease.
    lease-time: ${REDIS_LOCK_LEASE_TIME:60s}

  chat:
    redis:
      enabled: ${CHAT_REDIS_ENABLED:false}
      channel-prefix: ${CHAT_REDIS_CHANNEL_PREFIX:fleaflea:chat}

server:
  port: 8080
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:8080}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"
  structured:
    format:
      console: ${LOG_FORMAT_CONSOLE:}
    ecs:
      service:
        name: fleaflea
        version: ${APP_VERSION:local}
        environment: ${APP_ENV:local}
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.anabada.fleaflea: ${LOG_LEVEL_APP:INFO}
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

gcp:
  storage:
    bucket: ${GCS_BUCKET:}
    signed-url-duration: ${GCS_SIGNED_URL_DURATION:1h}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-token-signing-must-be-atleast-256-bits}
  access-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

fcm:
  enabled: ${FCM_ENABLED:false}
  project-id: ${FCM_PROJECT_ID:}
  web-app-url: ${FCM_WEB_APP_URL:}
  web-click-link-enabled: ${FCM_WEB_CLICK_LINK_ENABLED:true}
