spring:
  application:
    name: fleaflea

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleaflea_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true

  task:
    scheduling:
      pool:
        size: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

server:
  port: 8080
  forward-headers-strategy: framework

swagger:
  server-url: ${SWAGGER_SERVER_URL:https://fleaflea.duckdns.org}

logging:
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.anabada.fleaflea: ${LOG_LEVEL_APP:INFO}
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-token-signing-must-be-atleast-256-bits}
  access-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
