spring:
  application:
    name: fleaflea

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/fleaflea?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  jackson:
    time-zone: Asia/Seoul

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    org.hibernate.SQL: debug