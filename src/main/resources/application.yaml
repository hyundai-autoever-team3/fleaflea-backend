spring:
  application:
    name: fleaflea

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleaflea_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    validate-migration-naming: true

  task:
    scheduling:
      pool:
        size: 2

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: ${HIBERNATE_FORMAT_SQL:false}
    open-in-view: false

app:
  environment: ${APP_ENV:local}
  version: ${APP_VERSION:local}
  redis-lock:
    wait-time: ${REDIS_LOCK_WAIT_TIME:5s}
    lease-time: ${REDIS_LOCK_LEASE_TIME:60s}

server:
  port: 8080
  forward-headers-strategy: framework

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5175,http://localhost:8080}

swagger:
  server-url: ${SWAGGER_SERVER_URL:http://localhost:8080}

logging:
  pattern:
    level: "%5p [trace_id=%X{trace_id:-} span_id=%X{span_id:-}]"
  structured:
    format:
      console: ${LOG_FORMAT_CONSOLE:}
    ecs:
      service:
        name: fleaflea
        version: ${APP_VERSION:local}
        environment: ${APP_ENV:local}
  level:
    root: ${LOG_LEVEL_ROOT:WARN}
    com.anabada.fleaflea: ${LOG_LEVEL_APP:INFO}
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: ERROR
    org.hibernate.SQL: ${LOG_LEVEL_HIBERNATE_SQL:WARN}

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${S3_BUCKET}

management:
  health:
    redis:
      enabled: ${REDIS_HEALTH_ENABLED:false}
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  metrics:
    tags:
      service: ${spring.application.name}
      environment: ${APP_ENV:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true
  otlp:
    metrics:
      export:
        enabled: false

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-token-signing-must-be-atleast-256-bits}
  access-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}
