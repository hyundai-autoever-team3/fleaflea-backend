spring:
  application:
    name: fleaflea

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fleaflea_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:my-secret-key-for-jwt-token-signing-must-be-atleast-256-bits}
  access-expiration: 1800000
  refresh-expiration: 604800000